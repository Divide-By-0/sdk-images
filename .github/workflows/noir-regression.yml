name: Noir compilation regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['noir/**', 'sdk-utils/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/noir-regression.yml']
  push:
    branches: [main, staging]
    paths: ['noir/**', 'sdk-utils/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/noir-regression.yml']
  workflow_dispatch: {}

jobs:
  compile-private-regex:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          curl -fLsS https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.5/nargo-x86_64-unknown-linux-gnu.tar.gz -o /tmp/nargo.tar.gz
          echo 'a99c2aaab24e97a41a72224dd345aa82e8c8c21911b3d51ab38c232987fbdb5e  /tmp/nargo.tar.gz' | sha256sum -c -
          sudo tar -xzf /tmp/nargo.tar.gz -C /usr/local/bin nargo
      - name: Compile private and public regexes for both RSA key sizes
        working-directory: noir
        run: cargo test --locked -p noir test_compile_circuit_private_only_regex -- --test-threads=1
